name: dailymotion-extractor
service:
  name: app
  instance_type: Free
  regions:
    - fra
  scaling:
    min: 1
    max: 1
  routes:
    - path: /
      port: 8080
  env:
    - key: PORT
      value: "8080"
    # TELEGRAM_BOT_TOKEN should be added as a secret via the Koyeb dashboard
  buildpacks:
    # Use Heroku-compatible buildpacks
    - name: heroku/python
  health_check:
    port: 8080
    path: /health
    initial_delay: 30s
    timeout: 5s
    interval: 30s
    failure_threshold: 3